<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>No signal</title>
<!--
  Deliberately a flat file rather than a route.

  This is what the service worker serves when a page needed the network and
  there wasn't one, so it has to survive the conditions that produced it: no
  network, no stylesheet, no framework, and build hashes that may have all
  changed since this device was last online. A Next route would pull in the
  router's chunks, and a page that fails to hydrate is replaced by the error
  boundary — which is the very dead end this page exists to prevent.

  So: no build output, no imports, everything inline.
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 2rem 1.75rem calc(env(safe-area-inset-bottom, 0px) + 2rem);
    background: #17191c;
    color: #e4e6e9;
    font: 400 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
  }
  .marks { display: flex; gap: 0.5rem; }
  .marks svg { width: 54px; height: 48px; }
  h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
  .note { margin: 0.55rem auto 0; max-width: 20rem; font-size: 0.9rem; line-height: 1.6; color: #8b919a; }
  .retry {
    padding: 0.5rem 0.75rem;
    border: 0;
    background: none;
    color: #5c636c;
    font: inherit;
    font-size: 0.85rem;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  [hidden] { display: none !important; }
</style>

<span class="marks" role="img" aria-label="Tummy">
  <!-- Tummy's mark, as in src/components/TummyMark.tsx, inline so it needs nothing from the build. -->
  <svg viewBox="108 130 296 264" aria-hidden="true">
    <g transform="translate(0 -46)">
      <g fill="none" stroke="#c58f95" stroke-linecap="round" stroke-linejoin="round" stroke-width="22">
        <path d="M128 282 H384" /><path d="M146 282 A110 110 0 0 0 366 282" /><path d="M222 420 H290" />
      </g>
      <g fill="#8d9e85"><rect x="148" y="190" width="38" height="74" rx="13" /><rect x="326" y="190" width="38" height="74" rx="13" /></g>
      <path d="M186 227 H326" fill="none" stroke="#8d9e85" stroke-width="22" stroke-linecap="round" />
    </g>
  </svg>
</span>

<div>
  <h1>No signal</h1>
  <!-- Not a failure: nothing is broken, there is just no network. -->
  <p class="note">Logging needs a connection. Everything will be here when you&rsquo;re back.</p>
</div>

<button class="retry" id="retry" type="button" hidden>Try again</button>

<script>
  (function () {
    var retry = document.getElementById("retry");
    retry.hidden = false;
    // This page is served at whichever URL failed, so the address bar still
    // points at it and a plain reload retries that page, not this one.
    retry.addEventListener("click", function () {
      location.reload();
    });
  })();
</script>
